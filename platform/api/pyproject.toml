[project]
name = "veye-api"
version = "0.2.0"
description = "VEYE modular-monolith API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.2",
  "argon2-cffi>=25.1,<26",
  "fastapi==0.141.1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
# Development AI observability and the optional Groq development provider.
# Neither is required to boot, test or run the Companion with the mock provider.
ai = [
  "groq>=1.0,<2",
  "langfuse>=4.0,<5",
]
test = [
  "aiosmtpd>=1.4,<2",
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:aiosmtpd.*"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.setuptools.package-data]
app = ["**/*.md", "**/*.txt"]
