<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/web/wp/veye-ico.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veye — Choose a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teachers:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css?v=2">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/auth.css?v=5">
<link rel="stylesheet" href="styles/auth-app.css?v=1">
</head>
<body>
<!-- The password change screen: where the emailed reset link lands (in the
     application, /reset-password?token=…). Same frame as Sign in — photo,
     logo and tagline on the left, the form on the right — and the
     application's own words. Prototype: like Sign in and Sign up it never reads
     what is typed (the application checks it); saving returns to Sign in with
     the "password changed" note. -->
<main class="auth">
  <section class="auth__media">
    <img class="auth__photo" src="login-people.jpg" alt="">
    <img class="auth__logo" src="assets/img/veye-logo-white.svg" alt="Veye">
    <span class="auth__tagline">Nutrition Reimagined</span>
  </section>

  <section class="auth__panel">
    <!-- No `name` on the password inputs: a control without a name is never
         serialized, so neither password can reach a URL even without auth.js. -->
    <form class="auth__form" id="resetForm" action="login.html" method="get" novalidate>
      <h1 class="auth__title">Choose a new password</h1>
      <p class="auth__subtitle">The link works once and expires soon.</p>

      <div class="auth__fields">
        <div class="field">
          <input class="field__input" type="password" id="rpNew" placeholder="New password" aria-label="New password" autocomplete="new-password">
          <button type="button" class="field__eye" aria-label="Show password">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c7 0 10.5 7 10.5 7a18.3 18.3 0 0 1-3.4 4.1M6.5 8.3A18.2 18.2 0 0 0 1.5 12S5 19 12 19c1.4 0 2.7-.3 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field">
          <input class="field__input" type="password" id="rpConfirm" placeholder="Confirm new password" aria-label="Confirm new password" autocomplete="new-password">
          <button type="button" class="field__eye" aria-label="Show password">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c7 0 10.5 7 10.5 7a18.3 18.3 0 0 1-3.4 4.1M6.5 8.3A18.2 18.2 0 0 0 1.5 12S5 19 12 19c1.4 0 2.7-.3 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--mt">Save new password</button>
      <p class="auth__links"><a href="login.html">Back to sign in</a></p>
    </form>
  </section>
</main>

<script src="js/veye-calculations.js?v=5"></script>
<script src="js/auth.js?v=6" defer></script>
</body>
</html>
