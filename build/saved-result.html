<!-- Where the emailed link lands (owner decision, 14 Nov 2026; the
     application's /saved-result, app/saved-result/page.tsx). Opening it proves
     the mailbox is reachable; it shows nothing about the result itself — no
     answers and no number — only that a result is saved and until when. Same
     frame as Sign in, and the application's own words.
     Prototype: no email is sent. The onboarding result (with the owner switch,
     onboarding.html?saving=30) links here as "Prototype: open the link from the
     email"; opened directly with nothing saved, the page shows the
     application's "That did not work" state. -->

    <img class="auth__logo" src="assets/img/veye-logo-white.svg" alt="Veye">

  <section class="auth__panel">
